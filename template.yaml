AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Currency Tracking and Alert System with Telegram Notifications

Parameters:
  TelegramBotToken:
    Type: String
    Description: Telegram Bot Token
    NoEcho: true
  KoreaEximAuthkey:
    Type: String
    Description: KoreaExim Exchange Rate API authentication key (authkey)
    NoEcho: true
  ExchangeApiKey:
    Type: String
    Description: Exchange Rate API Key (legacy, optional)
    Default: ''
    NoEcho: true
  SecretKey:
    Type: String
    Description: Secret key for JWT token signing (generate a strong random string)
    NoEcho: true
    Default: 'change-this-secret-key-in-production'

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    Environment:
      Variables:
        ALERTS_TABLE_NAME: !Ref AlertsTable
        EXCHANGE_RATES_TABLE_NAME: !Ref ExchangeRatesTable
        RATE_HISTORY_TABLE_NAME: !Ref RateHistoryTable
        EVENTBRIDGE_BUS: currency-events
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        KOREAEXIM_AUTHKEY: !Ref KoreaEximAuthkey
        EXCHANGE_API_KEY: !Ref ExchangeApiKey
        EXCHANGE_API_URL: https://api.exchangerate-api.com/v4/latest/
        USERS_TABLE_NAME: !Ref UsersTable
        SECRET_KEY: !Ref SecretKey
        ACCESS_TOKEN_EXPIRE_MINUTES: 30

Resources:
  # DynamoDB Table for storing alerts
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: currency-alerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alert_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: base_currency
          AttributeType: S
        - AttributeName: active_user_id
          AttributeType: S
      KeySchema:
        - AttributeName: alert_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: base_currency-index
          KeySchema:
            - AttributeName: base_currency
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # Sparse index: only contains items where active_user_id exists (active alerts)
        # Enables efficient queries for active alerts per user without scanning inactive ones
        - IndexName: active_user_id-index
          KeySchema:
            - AttributeName: active_user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # DynamoDB Table for storing users
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ExchangeRatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: exchange-rates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: currency_code
          AttributeType: S
      KeySchema:
        - AttributeName: currency_code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # DynamoDB Table for storing rate history (time-series data)
  RateHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: rate-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: currency_code
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: currency_code
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # API Gateway + FastAPI Lambda
  CurrencyApi:
    Type: AWS::Serverless::Function
    Properties:
      Description: Handles all API requests for the currency alert system.
      CodeUri: src/
      Handler: app.main.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          Type: Api
          Properties:
            Path: /
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExchangeRatesTable
        - DynamoDBReadPolicy:
            TableName: !Ref RateHistoryTable

  # Lambda to fetch currency rates
  FetchRatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions.fetch_rates.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateHistoryTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref CurrencyEventBus
      Events:
        ScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: cron(5 2 * * ? *)
            Enabled: true

  # EventBridge Rule for rate updates
  RateUpdateRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref CurrencyEventBus
      EventPattern:
        source:
          - currency.tracker
        detail-type:
          - Rate Updated
      Targets:
        - Arn: !GetAtt CheckAlertsFunction.Arn
          Id: CheckAlertsTarget

  # Lambda to check alerts and send notifications
  CheckAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions.check_alerts.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RateHistoryTable
      Events: {}  # EventBridge rule is defined separately above

  # Lambda to generate and send weekly reports
  WeeklyReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions.weekly_report.lambda_handler
      Timeout: 60  # Reports may take longer to generate
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RateHistoryTable
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            # Every Monday at 9 AM KST (00:00 UTC)
            Schedule: cron(0 0 ? * MON *)
            Enabled: true

  # EventBridge Custom Bus
  CurrencyEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: currency-events

  # Permission for EventBridge to invoke CheckAlertsFunction
  CheckAlertsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CheckAlertsFunction
      Principal: events.amazonaws.com
      Action: lambda:InvokeFunction
      SourceArn: !GetAtt RateUpdateRule.Arn

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
  AlertsTableName:
    Description: DynamoDB Table name
    Value: !Ref AlertsTable

